# ============================================================================
#  Cloudflare Workers 标准部署配置（"一键部署"按钮与 wrangler 用）
# ----------------------------------------------------------------------------
#  · 走 deploy/一键.py（API 直传）那条路【不需要】本文件。
#  · 本文件是给 Cloudflare 的 Deploy 按钮 / wrangler 用的：按钮会读它，
#    自动建 Worker、自动创建下面的 KV 命名空间，并把变量注入进去。
#  · 非机密配置写在 [vars]；三个机密（ADMIN_PASSWORD / SYNC_SECRET /
#    VLESS_UUID）请用控制台的 Encrypt 或 `wrangler secret put` 单独设置，
#    【不要】写进本文件（本文件会进版本库）。
# ============================================================================
name = "noc-edge"
main = "edge/worker_deploy.js"
compatibility_date = "2026-01-01"
# ---------------------------------------------------------------------------
# 键值存储（用户库 + 全局快照）。
#   一键部署流程会自动创建命名空间并把 id 回填到这里；
#   手工部署时把 id 换成你自己的命名空间 id。
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SUB_DB"
id = ""
# ---------------------------------------------------------------------------
# 非机密运行参数。改完重新部署即可生效（脚本运行时会读绑定）。
# ---------------------------------------------------------------------------
[vars]
# 大屏与订阅入口域名（例如 sub.example.com）
WORKER_HOST = "sub.example.com"
# 隧道入口域名（例如 vpn.example.com）
TUNNEL_HOST = "vpn.example.com"
# 统计日界线时区
DAY_TZ = "UTC"
# 节点清单：格式 "路径:地址"，逗号分隔；路径省略时按 /kl 处理。
#   ⚠ 按钮部署这条路【必须】填这一项：默认清单里的地址是构建期占位符，
#     没有构建期就填不进去，运行时会把这些占位条目剔掉（清单会变空）。
NODES = "/kl:198.51.100.101,/kl:198.51.100.102,/hk:198.51.100.103"
